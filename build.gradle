plugins {
    id 'com.android.application' version '8.13.2'
}

repositories {
    mavenCentral()
    google()
    maven {
        url "https://jitpack.io"
    }
}

def getGitRepoUrl = {
    try {
        def proc = ['git', 'remote', 'get-url', 'origin'].execute()
        proc.waitFor()
        def url = proc.text.trim()
        if (url.startsWith('git@github.com:')) {
            url = 'https://github.com/' + url.substring('git@github.com:'.length())
        }
        if (url.endsWith('.git')) {
            url = url.substring(0, url.length() - 4)
        }
        return url
    } catch (Exception e) {
        return 'https://github.com/Akylas/OSS-Dict'
    }
}

